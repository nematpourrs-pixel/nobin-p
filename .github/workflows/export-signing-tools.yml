name: Export Android Signing Tools
on:
  push:
    branches: [main]
    paths:
      - '.github/trigger/export-signing-tools'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Collect latest Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using $BT"
          mkdir -p tools/lib tools/lib64
          cp "$BT/apksigner" tools/
          cp "$BT/zipalign" tools/
          cp "$BT/lib/apksigner.jar" tools/lib/
          cp "$BT/lib64/libc++.so" tools/lib64/
          chmod +x tools/apksigner tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: tools
          retention-days: 1
