name: Android Public Build
on:
  push:
    branches: [main]
    paths:
      - '.github/trigger/android-build'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install
      - name: Restore fixed Nobin logo
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p assets
          base64 --decode assets/nobin-logo-fixed.webp.b64 > /tmp/nobin-logo-fixed.webp
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('/tmp/nobin-logo-fixed.webp')
          with Image.open(p) as check: check.verify()
          source=Image.open(p).convert('RGB')
          w,h=source.size
          # Focus on the original calendar and faces, not the large white/gold outer frame.
          motif=source.crop((round(w*.12),round(h*.115),round(w*.88),round(h*.88)))
          from PIL import ImageOps
          # Legacy launchers get a full-size, high-contrast artwork without outer padding.
          icon=ImageOps.fit(motif,(1024,1024),Image.Resampling.LANCZOS)
          icon.save('assets/icon.png',optimize=True)
          # Adaptive foreground: maximize the key motifs while feathering white edges.
          # Outer cropping by shaped launchers only removes background, not faces.
          target=680
          art=ImageOps.fit(motif,(target,target),Image.Resampling.LANCZOS).convert('RGBA')
          # Feather the light backdrop into the launcher background without drawing a small white square.
          alpha=Image.new('L',(target,target),0)
          px=alpha.load()
          for y in range(target):
              for x in range(target):
                  dist=min(x,y,target-1-x,target-1-y)
                  px[x,y]=min(255,round(max(0,dist)*255/42))
          art.putalpha(alpha)
          adaptive=Image.new('RGBA',(1024,1024),(0,0,0,0))
          adaptive.alpha_composite(art,((1024-target)//2,(1024-target)//2))
          adaptive.save('assets/adaptive-icon.png',optimize=True)
          PY
          
          sha256sum assets/icon.png assets/adaptive-icon.png

      - name: Typecheck
        run: npm run typecheck
      - name: Validate Expo bundle
        run: npx expo export --platform android --output-dir /tmp/nobin-export
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
      - name: Disable generated debug signing for release artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          marker='release {'
          i=s.find(marker)
          if i < 0: raise SystemExit('release block not found')
          j=s.find('signingConfig signingConfigs.debug', i)
          if j >= 0:
              s=s[:j]+'signingConfig null'+s[j+len('signingConfig signingConfigs.debug'):]
          # Native debug-symbol metadata is not needed for the CafeBazaar release and
          # can consume several GB while merging React Native ABIs.
          rel=s.find('release {')
          if rel >= 0 and "debugSymbolLevel 'none'" not in s[rel:rel+1200]:
              brace=s.find('{', rel)+1
              s=s[:brace]+"\n            ndk { debugSymbolLevel 'none' }"+s[brace:]
          p.write_text(s)
          gp=Path('android/gradle.properties')
          gs=gp.read_text() if gp.exists() else ''
          lines=[x for x in gs.splitlines() if not x.startswith('reactNativeArchitectures=')]
          lines.append('reactNativeArchitectures=armeabi-v7a,arm64-v8a')
          gp.write_text('\n'.join(lines)+'\n')
          PY
      - name: Build unsigned CafeBazaar APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
          ./gradlew bundleRelease --stacktrace --no-daemon
      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} release-output/ \;
          ls -lah release-output
      - uses: actions/upload-artifact@v4
        with:
          name: nobin-android-unsigned
          path: release-output
          if-no-files-found: error
          retention-days: 7
