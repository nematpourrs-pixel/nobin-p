name: Android Public Build
on:
  push:
    branches: [main]
    paths:
      - '.github/trigger/android-build'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install
      - name: Install compatible image picker
        run: npx expo install expo-image-picker
      - name: Generate release launcher icons
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          W=1024
          cream=(247,242,232,255); teal=(0,82,70,255); teal2=(4,112,94,255); gold=(207,161,67,255); white=(255,255,255,255)
          def draw_logo(bg=True):
              im=Image.new("RGBA",(W,W),cream if bg else (0,0,0,0))
              d=ImageDraw.Draw(im)
              # calendar shell
              box=(150,145,874,878)
              d.rounded_rectangle(box, radius=150, fill=teal)
              inner=(195,285,829,825)
              d.rounded_rectangle(inner, radius=95, fill=cream if bg else white)
              # binder rings
              for x in (345,680):
                  d.rounded_rectangle((x-42,72,x+42,235),radius=42,fill=gold)
                  d.rounded_rectangle((x-27,87,x+27,220),radius=27,fill=(232,193,99,255))
              # female abstract profile (left)
              d.ellipse((250,390,530,680),fill=teal2)
              d.pieslice((286,414,550,685),70,285,fill=cream if bg else white)
              d.polygon([(286,518),(232,676),(386,745),(447,647),(375,613)],fill=teal)
              d.polygon([(335,405),(455,465),(372,655),(333,626),(388,520),(302,470)],fill=gold)
              # male abstract profile (right)
              d.ellipse((500,390,780,680),fill=teal)
              d.pieslice((468,420,742,688),250,110,fill=cream if bg else white)
              d.polygon([(681,565),(772,602),(724,700),(598,708),(560,635)],fill=teal)
              # beard cue
              d.arc((590,500,750,680),20,150,fill=gold,width=18)
              # center leaf / sparkle
              d.polygon([(512,685),(548,742),(512,802),(476,742)],fill=gold)
              d.polygon([(512,710),(530,742),(512,770),(494,742)],fill=(239,209,132,255))
              return im
          draw_logo(True).save("assets/icon.png",optimize=True)
          fg=draw_logo(False)
          # keep foreground away from mask edges
          canvas=Image.new("RGBA",(W,W),(0,0,0,0))
          fg=fg.resize((760,760),Image.Resampling.LANCZOS)
          canvas.alpha_composite(fg,((W-760)//2,(W-760)//2))
          canvas.save("assets/adaptive-icon.png",optimize=True)
          PY
          file assets/icon.png assets/adaptive-icon.png

      - name: Typecheck
        run: npm run typecheck
      - name: Validate Expo bundle
        run: npx expo export --platform android --output-dir /tmp/nobin-export
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
      - name: Disable generated debug signing for release artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          marker='release {'
          i=s.find(marker)
          if i < 0: raise SystemExit('release block not found')
          j=s.find('signingConfig signingConfigs.debug', i)
          if j >= 0:
              s=s[:j]+'signingConfig null'+s[j+len('signingConfig signingConfigs.debug'):]
          # Native debug-symbol metadata is not needed for the CafeBazaar release and
          # can consume several GB while merging React Native ABIs.
          rel=s.find('release {')
          if rel >= 0 and "debugSymbolLevel 'none'" not in s[rel:rel+1200]:
              brace=s.find('{', rel)+1
              s=s[:brace]+"\n            ndk { debugSymbolLevel 'none' }"+s[brace:]
          p.write_text(s)
          gp=Path('android/gradle.properties')
          gs=gp.read_text() if gp.exists() else ''
          lines=[x for x in gs.splitlines() if not x.startswith('reactNativeArchitectures=')]
          lines.append('reactNativeArchitectures=armeabi-v7a,arm64-v8a')
          gp.write_text('\n'.join(lines)+'\n')
          PY
      - name: Build unsigned CafeBazaar APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
          ./gradlew bundleRelease --stacktrace --no-daemon
      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} release-output/ \;
          ls -lah release-output
      - uses: actions/upload-artifact@v4
        with:
          name: nobin-android-unsigned
          path: release-output
          if-no-files-found: error
          retention-days: 7
